name: Deploy explorer to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "explorer/**"
      - "dist/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/dist
          cp explorer/*.html explorer/*.js explorer/*.css explorer/*.svg _site/
          cp dist/openformulagraph.json _site/dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
