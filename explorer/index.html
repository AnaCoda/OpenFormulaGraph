<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OpenFormulaGraph Explorer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body x-data="explorer()" x-init="init()">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">&fnof;</span>
      <span class="brand-name">OpenFormulaGraph</span>
    </div>
  </header>

  <main class="layout" :class="{ 'sheet-open': sheet, 'sheet-full': sheetFull }" :data-sheet="sheet">
    <aside class="panel panel-body panel-explore">
        <div class="sheet-handle" @pointerdown="startSheetDrag($event)"><span></span></div>
        <template x-if="!selected">
          <section class="panel-block hint">
            <h2>Explore</h2>
            <p>Click any quantity (circle) or equation (card) to see how it connects to the rest of the graph.</p>
          </section>
        </template>

        <template x-if="selectedQuantity">
          <section class="panel-block detail">
            <div class="detail-header">
              <span class="detail-symbol" x-text="displaySymbol(selectedQuantity.symbol)"></span>
              <h2 x-text="selectedQuantity.name"></h2>
            </div>
            <p class="detail-description" x-show="selectedQuantity.description" x-text="selectedQuantity.description"></p>
            <dl class="detail-facts">
              <div>
                <dt>SI unit <a class="help-link" :href="helpLinks.siUnit" target="_blank" rel="noopener" title="What is an SI unit?">?</a></dt>
                <dd x-text="formatUnit(selectedQuantity.si_unit)"></dd>
              </div>
              <div>
                <dt>Dimension <a class="help-link" :href="helpLinks.dimension" target="_blank" rel="noopener" title="What is dimensional analysis?">?</a></dt>
                <dd x-text="formatDimension(selectedQuantity.dimension)"></dd>
              </div>
            </dl>
            <div class="learn-links" x-show="selectedQuantity.links?.length">
              <template x-for="link in selectedQuantity.links" :key="link.url">
                <a class="learn-link" :href="link.url" target="_blank" rel="noopener" x-text="link.label"></a>
              </template>
            </div>

            <h3>Appears in</h3>
            <ul class="related-list" x-show="relatedEquations.length">
              <template x-for="eq in relatedEquations" :key="eq.id">
                <li class="related-row" @click="selectEquation(eq.id)">
                  <div class="related-main">
                    <span class="related-katex" x-html="eq.katex"></span>
                    <span class="related-subtitle" x-text="eq.name"></span>
                  </div>
                  <span class="related-role" x-text="eq.role"></span>
                </li>
              </template>
            </ul>
            <p class="empty-note" x-show="!relatedEquations.length">No equations reference this quantity yet.</p>
          </section>
        </template>

        <template x-if="selectedEquation">
          <section class="panel-block detail">
            <h2 x-text="selectedEquation.name"></h2>
            <div class="detail-katex-big" x-html="selectedEquation.katex"></div>
            <p class="detail-description" x-show="selectedEquation.description" x-text="selectedEquation.description"></p>
            <a
              class="source-link"
              x-show="selectedEquation.source?.url"
              :href="selectedEquation.source?.url"
              target="_blank"
              rel="noopener"
              x-text="sourceLabel(selectedEquation.source)"
            ></a>
            <div class="learn-links" x-show="selectedEquation.links?.length">
              <template x-for="link in selectedEquation.links" :key="link.url">
                <a class="learn-link" :href="link.url" target="_blank" rel="noopener" x-text="link.label"></a>
              </template>
            </div>

            <h3>Variables</h3>
            <ul class="related-list">
              <template x-for="v in relatedQuantities" :key="v.symbol">
                <li class="related-row" @click="selectQuantity(v.qid)">
                  <span class="related-symbol" x-html="v.symbolKatex"></span>
                  <span class="related-name" x-text="v.name"></span>
                  <div class="related-meta">
                    <span class="related-role" x-show="v.role" x-text="v.role"></span>
                    <span class="related-unit" x-text="v.unit"></span>
                  </div>
                </li>
              </template>
            </ul>
          </section>
        </template>
    </aside>

    <div id="explore-resizer" class="panel-resizer" title="Drag to resize"></div>

    <div id="graph" class="graph"></div>

    <div id="curriculum-resizer" class="panel-resizer" title="Drag to resize"></div>

    <aside class="panel panel-body panel-curriculum">
        <div class="sheet-handle" @pointerdown="startSheetDrag($event)"><span></span></div>
        <section class="panel-block">
          <h2>Curriculum order</h2>
          <p class="curriculum-hint">Equations grouped by chapter, in the order they're introduced in OpenStax College Physics 2e. Click a chapter to add or remove it from the graph.</p>
          <div class="curriculum-list">
            <template x-for="topic in topicOrder" :key="topic">
              <div class="curriculum-item">
                <div class="curriculum-group-row">
                  <h4
                    class="curriculum-group-label"
                    :class="{ active: activeTopics.has(topic) }"
                    :style="activeTopics.has(topic) ? { background: topicColor(topic) } : {}"
                    :title="activeTopics.has(topic) ? 'Click to remove ' + topicLabel(topic) + ' from the graph' : 'Click to add ' + topicLabel(topic) + ' to the graph'"
                    @click="toggleTopic(topic)"
                    x-text="topicLabel(topic)"
                  ></h4>
                  <button
                    type="button"
                    class="curriculum-chevron"
                    :class="{ expanded: expandedTopics.has(topic) }"
                    :title="expandedTopics.has(topic) ? 'Collapse' : 'Expand to browse'"
                    @click="toggleExpanded(topic)"
                  ><svg width="10" height="10" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                </div>
                <template x-if="expandedTopics.has(topic)">
                  <div class="curriculum-sublist">
                    <template x-for="row in curriculumByTopic.get(topic)" :key="row.id">
                      <div
                        class="curriculum-row"
                        :class="{ active: selected?.type === 'equation' && selected.id === row.id }"
                        @click="selectEquation(row.id)"
                      >
                        <span class="curriculum-section" x-text="'§' + row.section"></span>
                        <div class="curriculum-main">
                          <span class="curriculum-katex" x-html="row.katex"></span>
                          <span class="curriculum-name" x-text="row.name"></span>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </section>
    </aside>
    <div class="sheet-scrim" :class="{ visible: sheetFull }" @click="closeSheet()"></div>
    <button class="fab-chapters" x-show="sheet !== 'chapters'" @click="openSheet('chapters')">Chapters</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/force-graph/dist/force-graph.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
