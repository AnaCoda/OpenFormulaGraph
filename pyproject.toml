[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openformulagraph"
version = "0.1.0"
description = "A small, open, machine-checkable graph of physics equations and quantities."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.12",
    "PyYAML>=6.0",
]

[project.scripts]
ofg = "ofg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
