id: electric-power-current-resistance
name: Electric Power (Current and Resistance)
description: The power dissipated by a resistor, expressed in terms of the current through it and its resistance, useful when the current is known but the voltage is not.
expr: "P - I**2*R"
latex: "P = I^2R"
variables:
  P: {quantity: power}
  I: {quantity: current}
  R: {quantity: resistance}
topic: electricity
requires: []
source:
