id: heat-transfer-specific-heat
name: Heat Transfer and Specific Heat
description: The heat needed to change a substance's temperature depends on its mass, its specific heat, and the size of the temperature change.
expr: "Q - m*c*dT"
latex: "Q = mc\\Delta T"
