id: relativistic-total-energy
name: Relativistic Total Energy
description: The total energy of a moving object, combining its rest energy and kinetic energy, which grows without bound as its speed approaches the speed of light.
expr: "E - m*c**2/sqrt(1 - v**2/c**2)"
latex: "E = \\frac{mc^2}{\\sqrt{1 - v^2/c^2}}"
