id: newtons-law-of-gravitation
name: Newton's Universal Law of Gravitation
description: Every particle of mass in the universe attracts every other particle with a force that grows with the product of their masses and shrinks with the square of the distance between their centers.
expr: "F - G*m1*m2/r**2"
latex: "F = \\frac{Gm_1m_2}{r^2}"
variables:
  F: {quantity: force, role: gravitational}
  G: {quantity: gravitational-constant}
  m1: {quantity: mass, role: first-body}
  m2: {quantity: mass, role: second-body}
  r: {quantity: radius}
topic: gravitation
requires: []
