id: coulombs-law
name: Coulomb's Law
description: The electrostatic force between two point charges is directly proportional to the magnitude of each charge and inversely proportional to the square of the distance separating them; like charges repel and opposite charges attract, with the force acting along the line joining the two charges.
expr: "F - k*q1*q2/r**2"
latex: "F = \\frac{kq_1q_2}{r^2}"
variables:
  F: {quantity: force, role: electric}
  k: {quantity: coulombs-constant}
  q1: {quantity: charge, role: first-charge}
  q2: {quantity: charge, role: second-charge}
  r: {quantity: radius}
topic: electricity
requires: []
source:
  ref: openstax-college-physics-2e
  section: "18.3"
  url: "https://openstax.org/books/college-physics-2e/pages/18-3-coulombs-law"
links:
