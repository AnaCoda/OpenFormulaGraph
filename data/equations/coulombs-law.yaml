  - {label: Khan Academy, url: "https://www.khanacademy.org/science/hs-physics/x215e29cb31244fa1:types-of-interactions/x215e29cb31244fa1:coulomb-s-law/a/coulombs-law-and-electric-force-ap-physics-1"}
