id: relativistic-momentum
name: Relativistic Momentum
description: At speeds approaching the speed of light, an object's momentum grows faster than mass times velocity, diverging as its speed approaches c.
expr: "p - m*v/sqrt(1 - v**2/c**2)"
latex: "p = \\frac{mv}{\\sqrt{1 - v^2/c^2}}"
