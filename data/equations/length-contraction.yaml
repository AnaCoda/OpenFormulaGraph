id: length-contraction
name: Length Contraction
description: An object moving at relativistic speed appears shortened along its direction of motion, as measured by an observer at rest.
expr: "L - L0*sqrt(1 - v**2/c**2)"
latex: "L = L_0\\sqrt{1 - v^2/c^2}"
variables:
  L: {quantity: length, role: contracted}
  L0: {quantity: length, role: proper}
  v: {quantity: velocity}
  c: {quantity: speed-of-light}
topic: relativity
requires: []
