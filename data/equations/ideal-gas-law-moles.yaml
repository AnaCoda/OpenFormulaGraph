id: ideal-gas-law-moles
name: Ideal Gas Law (Molar Form)
description: Relates the pressure, volume, and temperature of an ideal gas to the amount of gas present, measured in moles, via the universal gas constant.
expr: "P*V - n*R*T"
latex: "PV = nRT"
variables:
  P: {quantity: pressure}
  V: {quantity: volume}
  n: {quantity: amount-of-substance}
  R: {quantity: gas-constant}
  T: {quantity: temperature}
topic: thermodynamics
requires: []
