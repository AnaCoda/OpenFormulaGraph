id: electric-power-voltage-resistance
name: Electric Power (Voltage and Resistance)
description: The power dissipated by a resistor, expressed in terms of the voltage across it and its resistance, useful when the current is not directly known.
expr: "P - V**2/R"
latex: "P = \\frac{V^2}{R}"
