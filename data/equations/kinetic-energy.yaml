id: kinetic-energy
name: Kinetic Energy
description: The energy an object has by reason of its motion, equal to one-half its mass times the square of its speed.
expr: "E - m*v**2/2"
latex: "KE = \\tfrac{1}{2} m v^2"
variables:
  E: {quantity: energy}
  m: {quantity: mass}
  v: {quantity: velocity}
topic: energy
requires: []
source:
  ref: openstax-college-physics-2e
  section: "7.2"
  url: "https://openstax.org/books/college-physics-2e/pages/7-2-kinetic-energy-and-the-work-energy-theorem"
links:
  - {label: Wikipedia, url: "https://en.wikipedia.org/wiki/Kinetic_energy"}
  - {label: Khan Academy, url: "https://www.khanacademy.org/science/physics/work-and-energy/energy-tutorial/a/kinetic-energy"}
checks:
  - {given: {m: 2, v: 3}, solve_for: E, expect: 9}
