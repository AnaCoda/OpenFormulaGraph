id: gravitational-potential-energy
name: Gravitational Potential Energy
description: The energy an object has due to its position in a gravitational field, equal to the work done to raise it against gravity.
expr: "PE - m*g*h"
latex: "PE = mgh"
variables:
  PE: {quantity: energy, role: gravitational-potential}
  m: {quantity: mass}
  g: {quantity: gravitational-acceleration}
  h: {quantity: height}
topic: energy
requires: []
source:
  ref: openstax-college-physics-2e
  section: "7.3"
  url: "https://openstax.org/books/college-physics-2e/pages/7-3-gravitational-potential-energy"
links:
  - {label: Wikipedia, url: "https://en.wikipedia.org/wiki/Gravitational_energy"}
  - {label: Khan Academy, url: "https://www.khanacademy.org/science/physics/work-and-energy/work-and-energy-tutorial/a/what-is-gravitational-potential-energy"}
checks:
  - {given: {m: 2, g: 9.80, h: 5}, solve_for: PE, expect: 98.0}
