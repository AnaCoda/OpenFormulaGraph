id: de-broglie-wavelength
name: De Broglie Wavelength
description: Every moving particle has an associated wavelength inversely proportional to its momentum, revealing the wave nature of matter.
expr: "lam - h/p"
latex: "\\lambda = \\frac{h}{p}"
